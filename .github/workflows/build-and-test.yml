name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/TimeTracker.Core.Tests --configuration Release --logger 'trx;LogFileName=core-tests.trx'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: error
  windows-tests:
    name: Windows build and UI automation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and run both suites
        shell: pwsh
        run: ./scripts/Test.ps1 -IncludeUi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: error
